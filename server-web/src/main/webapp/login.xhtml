<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>            
        <title>#{bundle['login.title']}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="icon" type="image/x-icon" href="#{resource['favicon.ico']}"/>
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>
        <div class="login-container">
            <h:form id="loginForm">
                <p:panel id="loginPanel" header="#{login.headerLabel}">

                    <p:messages id="messages" showDetail="false" closable="true"/>

                    <div class="p-fluid">
                        <div class="p-field">
                            <label for="username">#{bundle['login.username']}</label>
                            <p:inputText id="username" 
                                         value="#{login.username}" 
                                         required="true"
                                         requiredMessage="#{bundle['login.username.required']}"
                                         autocomplete="username"/>
                        </div>

                        <div class="p-field">
                            <label for="password">#{bundle['login.password']}</label>
                            <p:password id="password" 
                                        value="#{login.password}" 
                                        required="true"
                                        requiredMessage="#{bundle['login.password.required']}"
                                        feedback="false"
                                        autocomplete="current-password"/>
                        </div>

                        <div class="p-field">
                            <p:commandButton value="#{bundle['login.submit']}" 
                                             action="#{login.doLogin}" 
                                             update="loginPanel"
                                             styleClass="p-button-primary"
                                             icon="pi pi-sign-in"/>
                        </div>
                    </div>
                </p:panel>
            </h:form>
        </div>

        <!-- Session expired handler -->
        <p:ajaxExceptionHandler type="jakarta.faces.application.ViewExpiredException" 
                                update="sessionExpiredDialog"
                                onexception="PF('sessionExpired').show();" />

        <p:dialog id="sessionExpiredDialog"
                  header="#{bundle['login.session.expired.title']}" 
                  widgetVar="sessionExpired" 
                  modal="true"
                  closable="false"
                  resizable="false">
            <h:panelGrid columns="1" style="text-align: center;">
                <i class="pi pi-info-circle" style="font-size: 3rem; color: #2196F3;"></i>
                <h:outputText value="#{bundle['login.session.expired.message']}" 
                              style="margin-top: 1rem;"/>
                <p:commandButton value="#{bundle['login.reload']}" 
                                 onclick="location.reload();"
                                 icon="pi pi-refresh"
                                 styleClass="p-button-primary"
                                 style="margin-top: 1rem;"/>
            </h:panelGrid>
            
        </p:dialog>
        
    </h:body>
</html>
