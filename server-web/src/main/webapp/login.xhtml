<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>            
        <title>#{bundle['login.title']}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="icon" type="image/x-icon" href="#{resource['favicon.ico']}"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@3.3.1/primeflex.css"/>

        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>

        <!-- Flex container to center login form -->
        <div class="flex align-items-center justify-content-center" style="min-height: 100vh;">
            <div class="col-12 md:col-6 lg:col-4 xl:col-3">
                <h:form id="loginForm">
                    <p:panel id="loginPanel" 
                             styleClass="login-card" 
                             header="#{login.headerLabel}">

                        <!-- Username field -->
                        <div class="field">
                            <label for="username" class="block mb-2 font-medium">
                                #{bundle['login.username']}
                            </label>
                            <p:inputText id="username" 
                                         value="#{login.username}" 
                                         required="true"
                                         requiredMessage="#{bundle['login.username.required']}"
                                         autocomplete="username"
                                         placeholder="#{bundle['login.username']}"
                                         styleClass="w-full"/>
                        </div>

                        <!-- Password field -->
                        <div class="field">
                            <label for="password" class="block mb-2 font-medium">
                                #{bundle['login.password']}
                            </label>
                            <p:password id="password" 
                                        value="#{login.password}" 
                                        required="true"
                                        requiredMessage="#{bundle['login.password.required']}"
                                        feedback="false"
                                        autocomplete="current-password"
                                        placeholder="#{bundle['login.password']}"
                                        styleClass="w-full"/>
                        </div>

                        <!-- Login button -->
                        <div class="field mt-4">
                            <p:commandButton value="#{bundle['login.submit']}" 
                                             action="#{login.doLogin}" 
                                             update="loginPanel"
                                             icon="pi pi-sign-in"
                                             styleClass="w-full p-button-lg"/>
                        </div>
                    </p:panel>
                </h:form>
            </div>
        </div>

        <!-- Session expired handler -->
        <p:ajaxExceptionHandler type="jakarta.faces.application.ViewExpiredException" 
                                update="sessionExpiredDialog"
                                onexception="PF('sessionExpired').show();" />

        <p:dialog id="sessionExpiredDialog"
                  header="#{bundle['login.session.expired.title']}" 
                  widgetVar="sessionExpired" 
                  modal="true"
                  closable="false"
                  resizable="false"
                  styleClass="w-11 md:w-6 lg:w-4">
            <div class="text-center">
                <i class="pi pi-info-circle text-6xl text-blue-500 mb-3"></i>
                <p class="mb-4">#{bundle['login.session.expired.message']}</p>
                <p:commandButton value="#{bundle['login.reload']}" 
                                 onclick="location.reload();"
                                 icon="pi pi-refresh"
                                 styleClass="p-button-primary"/>
            </div>
        </p:dialog>
        
        <p:messages />

    </h:body>
</html>
