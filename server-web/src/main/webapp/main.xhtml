<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>#{config.appName}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="context-path" content="#{request.contextPath}/"/>
        <link rel="icon" type="image/x-icon" href="#{resource['favicon.ico']}"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@3.3.1/primeflex.css"/>

        <h:outputStylesheet library="css" name="style.css" />
        <h:outputScript library="js" name="app.js" target="body"/>
    </h:head>

    <h:body>
        <!-- Global Exception Handlers -->
        <p:ajaxExceptionHandler type="jakarta.faces.application.ViewExpiredException"
                                update="sessionExpiredDialog"
                                onexception="PF('sessionExpired').show();" />

        <p:ajaxExceptionHandler type="java.lang.Exception"
                                update="errorDialog"
                                onexception="PF('errorDialog').show();" />

        <p:growl widgetVar="growl" showDetail="true" />

        <div class="app-container">

            <!-- Top Bar -->
            <div class="app-topbar">
                <div class="app-logo">
                    <p:graphicImage value="#{config.image}" 
                                    alt="#{config.appName}"
                                    rendered="#{config.image ne null}"
                                    styleClass="app-logo-image"/>
                    <span>#{config.appName}</span>
                </div>

                <h:form class="app-user-section">
                    <div class="user-info">
                        <i class="pi pi-user"></i>
                        <span>#{user.commonName}</span>
                    </div>
                    <p:commandButton 
                        value="#{bundle['main.logout']}" 
                        icon="pi pi-sign-out" 
                        styleClass="p-button-sm p-button-outlined p-button-secondary"
                        action="#{user.logout}"
                        ajax="false" />
                </h:form>
            </div>

            <!-- Content Wrapper (Sidebar + Main Content) -->
            <div class="app-content-wrapper">
                <!-- Sidebar Menu -->
                <div class="app-sidebar">
                    <h:form>
                        <p:commandLink 
                            styleClass="menu-item #{app.activePage eq 'terms' ? 'active' : ''}"
                            actionListener="#{app.navigateTo('terms')}"
                            update=":contentForm">
                            <i class="pi pi-list"></i>
                            <span>#{bundle['main.menu.terms.label']}</span>
                        </p:commandLink>

                        <ui:repeat value="#{user.primaryUnits}" var="primaryUnit" varStatus="status">
                            <!--rendered="{app.user.primaryUnitsSize > 0}"-->
                            <p:commandLink 
                                styleClass="menu-item #{app.activePage eq 'primaryUnit' ? 'active' : ''}"
                                actionListener="#{app.navigateTo('primaryUnit_'.concat(status.index))}"
                                update=":contentForm">
                                <i class="pi pi-users"></i>
                                <span>#{primaryUnit.displayTitle}</span>
                            </p:commandLink>
                        </ui:repeat>

                        <p:commandLink 
                            styleClass="menu-item #{app.activePage eq 'settings' ? 'active' : ''}"
                            rendered="#{config.settingsEnabled}"
                            actionListener="#{app.navigateTo('settings')}"
                            update=":contentForm">
                            <i class="pi pi-cog"></i>
                            <span>#{bundle['main.menu.settings']}</span>
                        </p:commandLink>

                        <p:commandLink 
                            styleClass="menu-item"
                            rendered="#{config.helpLink ne null}"
                            onclick="if (this.disabled)
                                        return false;
                                    window.open('#{config.getHelpLink()}', '_blank');
                                    return false;">
                            <i class="pi pi-question-circle"></i>
                            <span>#{bundle['main.menu.help']}</span>
                        </p:commandLink>
                    </h:form>
                </div>

                <!-- Main Content Area -->
                <div class="app-main-content">

                    <h:form id="contentForm">
                        <!-- Dynamic Content Based on Selected Menu -->
                        <ui:fragment rendered="#{app.activePage == 'terms'}">
                            <ui:include src="views/terms.xhtml"/>
                        </ui:fragment>

                        <ui:repeat value="#{user.primaryUnits}" var="primaryUnit" varStatus="status">
                            <ui:fragment rendered="#{app.activePage == 'primaryUnit_'.concat(status.index)}">
                                <ui:include src="views/primaryUnit.xhtml"/>
                            </ui:fragment>
                        </ui:repeat>

                        <ui:fragment rendered="#{app.activePage == 'settings'}">
                            <ui:include src="views/settings.xhtml"/>
                        </ui:fragment>

                    </h:form>
                </div>
            </div>

            <!-- Footer -->
            <div class="app-footer">
                <div class="footer-links">
                    <!--<h:link value="#{bundle['main.footer.impressum']}" outcome="impressum"/>-->
                    <h:outputLink 
                        rendered="#{config.privacyPolicyUrl ne null}"
                        value="#{config.privacyPolicyUrl}" 
                        target="_blank">
                        <h:outputText value="#{bundle['main.footer.datenschutz']}"/>
                    </h:outputLink>
                    <!--<h:link value="#{bundle['main.footer.barrierefreiheit']}" outcome="barrierefreiheit"/>-->
                    <h:outputLink value="https://www.sphairas.de" target="_blank">
                        <h:outputText value="#{bundle['main.footer.about']}"/>
                    </h:outputLink>
                </div>
                <div class="footer-copyright" rendered="#{config.copyrightFooter != null}">
                    #{config.copyrightFooter}
                </div>
            </div>
        </div>

        <!-- Session Expired Dialog -->
        <p:dialog id="sessionExpiredDialog"
                  header="#{bundle['session.expired.page.title']}" 
                  widgetVar="sessionExpired" 
                  modal="true"
                  closable="false">
            <h:form>
                <h:panelGrid columns="1" style="text-align: center;">
                    <i class="pi pi-info-circle" style="font-size: 3rem; color: #2196F3;"></i>
                    <h:outputText value="#{bundle['session.expired.page.message']}" style="margin-top: 1rem;"/>
                    <p:commandButton value="#{bundle['session.expired.page.button.login']}" 
                                     action="#{user.logout}"
                                     icon="pi pi-sign-in"
                                     style="margin-top: 1rem;"/>
                </h:panelGrid>
            </h:form>
        </p:dialog>

        <!-- General Error Dialog -->
        <p:dialog id="errorDialog"
                  header="Error #{bundle['error.page.title']}" 
                  widgetVar="errorDialog" 
                  modal="true">
            <h:form>
                <h:panelGrid columns="1" style="text-align: center;">
                    <i class="pi pi-times-circle" style="font-size: 3rem; color: #f44336;"></i>
                    <h:outputText value="#{bundle['error.page.message']}" style="margin-top: 1rem;"/>
                    <h:outputText value="#{pfExceptionHandler.message}" 
                                  style="font-weight: 600; margin-top: 0.5rem;"/>
                    <p:commandButton value="#{bundle['main.error.dialog.close']}" 
                                     onclick="PF('errorDialog').hide();"
                                     style="margin-top: 1rem;"/>
                </h:panelGrid>
            </h:form>
        </p:dialog>

        <!-- PrimeFaces Idle Monitor -->
        <p:idleMonitor timeout="120000" onidle="handleIdle();" />

        <p:messages />

        <p:lifecycle />
    </h:body>
</html>
