<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:composition>
        <div class="content-section">
            <h2><i class="pi pi-users"></i> #{primaryUnit.displayTitle}</h2>

            <!-- Menu Bar -->
            <p:menubar model="#{primaryUnit.menu}" styleClass="mb-3">  
                <f:facet name="options">  
                    <p:selectOneMenu value="#{primaryUnit.editingDocType}" 
                                     required="true" > 
                        <f:selectItems value="#{primaryUnit.editingDocTypes}" 
                                       var="type" 
                                       itemLabel="#{primaryUnit.getDocTypeDisplayName(type)}" />  
                        <p:ajax update="primaryUnitTable" />
                    </p:selectOneMenu>  
                </f:facet>  
            </p:menubar>

            <!-- Main Data Table -->
            <p:dataTable id="primaryUnitTable" 
                         var="student" 
                         value="#{primaryUnit.students}" 
                         rowKey="#{student.id}"
                         rowExpandMode="single" 
                         rowIndexVar="rowIndex"
                         scrollable="true"
                         styleClass="primaryunit-table" >

                <f:event type="preRenderComponent" listener="#{primaryUnit.onPreRenderComponent}"/>
                <p:ajax event="rowToggle" listener="#{primaryUnit.onRowToggle}" />

                <p:column style="width: 1.75rem; min-width: 1.75rem;">  
                    <p:rowToggler />  
                </p:column>  

                <p:column headerText="Name" style="width: 10rem; min-width: 10rem;/* adjust if long names wrap */">  
                    <h:outputText value="#{student.directoryName}" />  
                </p:column> 

                <p:columns value="#{primaryUnit.subjects}" 
                           var="subject" 
                           columnIndexVar="ci"
                           style="width: 3.5rem; min-width: 3.5rem; text-align: center;"
                           styleClass="grades-column" >
                    <f:facet name="header">
                        <h:outputText id="subject" value="#{util.label(subject)}" />
                        <p:tooltip for="subject" 
                                   value="#{util.tooltip(subject)}" 
                                   showEffect="fade" 
                                   hideEffect="fade" /> 
                    </f:facet>
                    <ui:param name="gradeVal" value="#{primaryUnit.getGradeValueAt(student, subject)}" />
                    <h:outputText value="#{gradeVal.shortLabel}" 
                                  styleClass="cell-highlightable cell-readonly #{gradeVal.styleClass}"/>
                </p:columns>  

                <!-- Row Expansion -->
                <p:rowExpansion rendered="#{student.isReportConfigurationEnabled()}">
                    <ui:include src="primaryUnit-rowExpansion.xhtml">
                        <ui:param name="student" value="#{student}" />
                        <ui:param name="primaryUnit" value="#{primaryUnit}" />
                    </ui:include>
                </p:rowExpansion>

            </p:dataTable>
        </div>
    </ui:composition>

</html>
