<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:composition>
        <div class="content-section">
            <h2><i class="pi pi-list"></i> #{bundle['main.menu.terms.label']}</h2>

            <!-- Simple empty message -->
            <ui:fragment rendered="#{app.user ne null and empty app.user.targetUnits.tabs}">
                <div class="flex justify-content-start m-2">
                    <h:outputText value="#{bundle['terms.tabs.emptyMessage']}" />
                </div>
            </ui:fragment>

            <ui:fragment rendered="#{app.user ne null and not empty app.user.targetUnits.tabs}">
                <p:blockUI block="termsAccordionPanel" trigger="termsAccordionPanel">
                    <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
                </p:blockUI>

                <p:accordionPanel id="termsAccordionPanel" 
                                  dynamic="true" 
                                  value="#{app.user.targetUnits.tabs}" 
                                  var="target" 
                                  rendered="#{app.user ne null and not empty app.user.targetUnits.tabs}" 
                                  activeIndex="#{app.user.targetUnits.activeTabIndex}" > 

                    <p:tab title="#{target.displayTitle}">   

                        <!-- Menu Bar -->
                        <!-- Sollte später durch p:fileDownload ersetzt werden. Die nested h:form ist notwendig zum Öffnen im neuen Tab.-->
                        <p:menubar model="#{target.menu}" styleClass="mb-3" />  

                        <!--stripedRows="true"-->
                        <p:dataTable id="datatable" 
                                     var="student" 
                                     widgetVar="datatableWidget"
                                     value="#{target.students}" 
                                     editable="true"  
                                     emptyMessage="#{bundle['terms.datatable.emptyMessage']}" 
                                     editMode="cell" 
                                     rowExpandMode="single" 
                                     rowIndexVar="rowIndex" 
                                     styleClass="p-datatable-striped p-datatable-gridlines"
                                     cellEditMode="click">     

                            <f:event type="preRenderComponent" listener="#{target.onPreRenderComponent}"/>

                            <p:ajax event="cellEdit" 
                                    listener="#{target.onCellEdit}" 
                                    update="@this"/>

                            <p:columnGroup type="header">   
                                <p:row>  
                                    <p:column rowspan="2" rendered="#{target.isCrossMarksEnabled() or target.hasComments()}" style="width:2%" />   
                                    <p:column rowspan="2" headerText="#{bundle['student.name']}" />   
                                    <p:column colspan="#{target.termColumns.size()}" rendered="#{!target.termColumns.isEmpty()}" headerText="#{bundle['column.header.vorzensuren']}" />  
                                    <p:column colspan="#{target.editableTermColumns.size()}" rendered="#{!target.editableTermColumns.isEmpty()}" headerText="#{target.editTerm.displayName}" /> 
                                </p:row>  
                                <p:row>   
                                    <p:column headerText="#{target.termColumns[0].displayName}" rendered="#{target.termColumns.size() ge 1}" style="width: 10%" width="10%"/>  
                                    <p:column headerText="#{target.termColumns[1].displayName}" rendered="#{target.termColumns.size() ge 2}" style="width: 10%" />  
                                    <p:column headerText="#{target.termColumns[2].displayName}" rendered="#{target.termColumns.size() ge 3}" style="width: 10%" />     
                                    <p:columns value="#{config.targetTypes}" var="targetType" headerText="#{bundle['column.header.' += targetType]}" rendered="#{target.editableTermColumns.get(targetType) ne null}" style="width: 10%" />  
                                </p:row>  
                            </p:columnGroup> 

                            <p:column rendered="#{target.isCrossMarksEnabled() or target.hasComments()}">  
                                <p:rowToggler />
                            </p:column>   
                            <p:column>  
                                <h:outputText value="#{student.directoryName}"/>  
                            </p:column>   

                            <p:columns value="#{target.termColumns}" var="term" columnIndexVar="ci" style="text-align: center;"  >
                                #{target.getGradeValueAt(student, term).shortLabel} 
                            </p:columns>  

                            <p:columns value="#{config.targetTypes}" 
                                       var="targetType" 
                                       columnIndexVar="ci"
                                       styleClass="ui-editable-column" 
                                       style="text-align: center;" 
                                       rendered="#{target.editableTermColumns.get(targetType) ne null}">  
                                <p:cellEditor rendered="#{target.getGradeValueAt(student, target.editableTermColumns.get(targetType)).editable}">  
                                    <f:facet name="output" >
                                        <h:outputText value="#{target.getGradeValueAt(student, target.editableTermColumns.get(targetType)).shortLabel}" 
                                                      styleClass="cell-editable cell-highlightable #{target.getGradeValueAt(student, target.editableTermColumns.get(targetType)).styleClass}" />
                                    </f:facet>  
                                    <f:facet name="input">    
                                        <p:selectOneMenu value="#{target.getGradeValueAt(student, target.editableTermColumns.get(targetType)).id}" 
                                                         style="width: 96% !important">  
                                            <f:selectItem itemLabel="#{bundle[targetType += '.noSelectionLabel']}" 
                                                          noSelectionOption="true" />
                                            <f:selectItems value="#{target.editableTermColumns.get(targetType).grades}" 
                                                           var="grade" 
                                                           itemLabel="#{target.resolveShortLabel(student, target.editableTermColumns.get(targetType), grade)}" 
                                                           itemValue="#{grade.id}" />  

                                            <p:ajax event="itemSelect" 
                                                    process="@this" 
                                                    update="@none"
                                                    oncomplete="document.activeElement.blur()" />

                                        </p:selectOneMenu>   
                                    </f:facet>       
                                </p:cellEditor> 
                                <h:outputText value="#{target.getGradeValueAt(student, target.editableTermColumns.get(targetType)).shortLabel}" 
                                              styleClass="cell-readonly cell-highlightable #{target.getGradeValueAt(student, target.editableTermColumns.get(targetType)).styleClass}" 
                                              rendered="${!target.getGradeValueAt(student, target.editableTermColumns.get(targetType)).editable}"/>

                            </p:columns> 

                            <p:rowExpansion rendered="#{target.hasComments() or target.isCrossMarksEnabled()}">
                                <ui:include src="terms-rowExpansion.xhtml">
                                    <ui:param name="student" value="#{student}" />
                                    <ui:param name="target" value="#{target}" />
                                </ui:include>                      
                            </p:rowExpansion>

                        </p:dataTable>  

                    </p:tab>
                </p:accordionPanel>
            </ui:fragment>

        </div>
    </ui:composition>

</html>
